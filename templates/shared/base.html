{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Título da página -->
    <title>{% block title %}Sistema de Mercado{% endblock %}</title>

    <!-- Arquivo CSS principal -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <!-- Script do menu mobile -->
    <script defer src="{% static 'js/menu.js' %}"></script>
</head>
<body>

    <!-- Cabeçalho principal do site -->
    <header class="navbar">
        <div class="container navbar-container">

            <!-- Logo do sistema -->
            <h1 class="logo">🛒 Mercado Sinistro</h1>

            <!-- Ícone do menu para celular -->
            <div class="menu-icon" onclick="toggleMenu()">☰</div>

            <!-- Menu de navegação -->
            <nav class="nav-links" id="mobileMenu">
                <a href="{% url 'produto:inicio' %}">Início</a>
                <a href="{% url 'produto:cadastrar' %}">Cadastrar Produto</a>
            </nav>

        </div>
    </header>

    <!-- Parte onde cada página coloca seu próprio conteúdo -->
    <main class="container main-content">
        {% if messages %}
            <div class="messages-container">
                {% for message in messages %}
                    <div class="alert {% if message.tags %}alert-{{ message.tags }}{% endif %}">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
            <style>
                .alert {
                    padding: 15px;
                    margin-bottom: 20px;
                    border: 1px solid transparent;
                    border-radius: 4px;
                }
                .alert-success {
                    color: #155724;
                    background-color: #d4edda;
                    border-color: #c3e6cb;
                }
                .alert-error, .alert-danger {
                    color: #721c24;
                    background-color: #f8d7da;
                    border-color: #f5c6cb;
                }
                .alert-warning {
                    color: #856404;
                    background-color: #fff3cd;
                    border-color: #ffeeba;
                }
                .alert-info {
                    color: #0c5460;
                    background-color: #d1ecf1;
                    border-color: #bee5eb;
                }
            </style>
        {% endif %}

        {% block content %}
        {% endblock %}
    </main>

    <!-- Rodapé separado em outro arquivo -->
    {% include 'partials/_footer.html' %}
</body>
</html>
