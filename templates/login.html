<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login - Sistema</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            width: 350px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
            color: #333;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        input {
            padding: 12px;
            margin: 8px 0;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        button {
            margin-top: 15px;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background-color: #2a5298;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #1e3c72;
        }

        .erro {
            color: red;
            margin-top: 10px;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #2a5298;
        }
    </style>
</head>
<body>

<div class="login-container">
    <div class="logo">🛒 Mercado Sinistro</div>
    <h2>Entrar</h2>

    <form method="post">
        {% csrf_token %}
        
        <input type="text" name="username" placeholder="Usuário" required>
        <input type="password" name="password" placeholder="Senha" required>

        <button type="submit">Entrar</button>
    </form>

    {% if form.errors %}
        <div class="erro">Usuário ou senha inválidos</div>
    {% endif %}
</div>

</body>
</html>
